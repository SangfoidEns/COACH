<!DOCTYPE html>

<meta name="theme-color" content="#0b0d0c">
<meta name="ms-auth-api" content="">
<meta name="description" content="METALIST STUTTGART — професійна цифрова платформа футбольного тренера: тактична дошка, тренування, вправи, команда та аналітика.">
<meta name="application-name" content="Metalist Coach">
<link rel="manifest" href="./manifest.webmanifest">

<body>
<div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>

<div class="app" id="app">
<header class="header header-tg glass-hdr glass-pill-hdr" id="appHeader">
  <div class="tg-hdr-pill">
    <button type="button" class="tg-clock-btn" id="clockBtn" data-action="open-stopwatch" title="Секундомір">
      <span id="clock"><strong>—</strong></span>
    </button>
    <div class="tg-hdr-center">
      <button type="button" class="tg-emblem" id="club-logo-btn"
        title="Тап — дошка · 5 с — картка тренера" aria-label="Емблема">
        <span class="tg-emblem-ring" aria-hidden="true"></span>
        <span class="logo-ph tg-emblem-face" id="clubLogo">МШ</span>
        <span class="tg-emblem-progress" id="emblemProgress" hidden></span>
      </button>
      <div class="tg-hdr-titles">
        <div class="brand-title" id="clubName">METALIST <em>STUTTGART</em></div>
        <div class="brand-coach" id="authBadge">—</div>
      </div>
    </div>
    <button type="button" class="tg-next-btn" id="nextTrBtn" data-view="trainings" title="Наступне тренування">
      <span class="tg-next-label">Далі</span>
      <span class="tg-next-val" id="nextTr">—</span>
      <span class="tg-next-cd" id="nextTrCountdown"></span>
    </button>
  </div>
</header>
<!-- hidden timer nodes for TimerEngine (UI in stopwatch sheet) -->
<div id="timerEngineHosts" hidden aria-hidden="true">
  <span id="timerMain">00:00</span>
  <span id="timerEx">00:00</span>
</div>




<main class="main" id="main" role="main">
  <div class="view on" id="v-dashboard"></div>
  <div class="view" id="v-trainings"></div>
  <div class="view view-board" id="v-board">
    <div class="btb btb-top" id="boardToolbarTop" aria-label="Верхня панель дошки"></div>
    <div class="ba" id="boardArea">
      <aside class="bench-panel" id="benchPanel" aria-label="Лавка запасних">
        <div class="bench-head">ЗАПАС</div>
        <div class="bench-list" id="benchList"></div>
      </aside>
      <div class="fc" id="fieldContainer">
        <div class="field-stage" id="fieldStage">
          <svg class="fs" id="fieldSvg" viewBox="0 0 680 1050" preserveAspectRatio="none"></svg>
          <div class="dl"><svg id="drawSvg" viewBox="0 0 680 1050" preserveAspectRatio="none"></svg></div>
          <div class="pl" id="playersLayer"></div>
        </div>
      </div>
    </div>
    <div class="btb btb-bottom" id="boardToolbarBottom" aria-label="Нижня панель інструментів"></div>
  </div>
  <div class="view" id="v-exercises"></div>
  <div class="view" id="v-players"></div>
  <div class="view" id="v-tactics"></div>
  <div class="view" id="v-calendar"></div>
  <div class="view" id="v-matches"></div>
  <div class="view" id="v-analytics"></div>
  <div class="view" id="v-settings"></div>
  <div class="view" id="v-back3"></div>
  <div class="view" id="v-myex"></div>
  <div class="view" id="v-diary"></div>
</main>

<aside class="rp" id="rightPanel" aria-label="Панель властивостей">
  <div class="rph">Властивості</div>
  <div class="rpb" id="rpBody">
    <div id="rpContent" style="margin-top:12px"><p style="font-size:12px;color:var(--muted)">Виберіть елемент для редагування.</p></div>

</div>
